[project]
name = "cycleflattener"
version = "1.0.0"
description = "angle optimal homologous cycle problem"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "biopython>=1.87",
    "cplex",
    "dash>=4.4.0",
    "docplex>=2.31.254",
    "matplotlib>=3.10.8",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pip>=26.0",
    "platformdirs>=4.10.1",
    "pydantic>=2.13.4",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
]


[tool.uv]
package = true

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
cycleflattener = { workspace = true }
cplex = { path = "cplex_python_3.10" }

[dependency-groups]
dev = [
    "cycleflattener",
    "pytest>=9.0.2",
]


[project.scripts]
cf_generate_data = "cycleflattener.generate_data:main"
cf_viewer = "cycleflattener.viewer:main"
cf_aohcp_nonsimple = "cycleflattener.aohcp_nonsimple:main"
cf_tabler = "cycleflattener.utils.tabler:main"
